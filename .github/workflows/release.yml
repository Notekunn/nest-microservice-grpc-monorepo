name: Release

on:
  push:
    branches: [main, staging, beta]

env:
  NODE_VERSION: '23'
  PNPM_VERSION: '10.11.0'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set NX variables
        run: |
          echo "NX_HEAD=${{ github.sha }}" >> $GITHUB_ENV
          echo "NX_BASE=${{ github.event.before }}" >> $GITHUB_ENV

      - name: Determine release type
        id: release-type
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "preid=" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == "staging" ]]; then
            echo "preid=alpha" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == "beta" ]]; then
            echo "preid=beta" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "Branch not configured for releases"
            exit 1
          fi

      - name: Run release
        run: |
          if [[ -n "${{ steps.release-type.outputs.preid }}" ]]; then
            pnpm nx release --skip-publish --first-release --preid=${{ steps.release-type.outputs.preid }}
          else
            pnpm nx release --skip-publish --first-release
          fi

      - name: Push changes and tags
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push --tags
