name: Docker Build

on:
  push:
    tags:
      - "*@v*"

env:
  REGISTRY: ghcr.io

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract service info from tag
        id: extract-info
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Full tag: $TAG_NAME"

          # Extract service name and version from tag (format: @nest-mono/service-user@v1.0.0)
          # First, get the part before the version (after the last @)
          SERVICE_FULL_NAME=$(echo "$TAG_NAME" | sed 's/@v[0-9].*$//')
          # Remove the @nest-mono/ prefix to get just the service name
          SERVICE_NAME=$(echo "$SERVICE_FULL_NAME" | sed 's/^@nest-mono\///')
          # Extract the version part (everything after the last @)
          SERVICE_TAG=$(echo "$TAG_NAME" | sed 's/.*@v/v/')

          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "service_tag=$SERVICE_TAG" >> $GITHUB_OUTPUT
          echo "image_name=${{ env.REGISTRY }}/${{ github.repository_owner }}/$SERVICE_NAME" >> $GITHUB_OUTPUT

          echo "Service Name: $SERVICE_NAME"
          echo "Service Tag: $SERVICE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.extract-info.outputs.image_name }}
          tags: |
            type=raw,value=${{ steps.extract-info.outputs.service_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ steps.extract-info.outputs.service_name }}
            SERVICE_TAG=${{ steps.extract-info.outputs.service_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.extract-info.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
