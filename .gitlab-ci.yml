image: node:24-alpine

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"
  NX_BRANCH: $CI_COMMIT_REF_NAME
  HARBOR_REGISTRY: harbor.example.com
  HARBOR_PROJECT: my-org
  GIT_DEPTH: "0"

stages:
  - setup
  - verify
  - build
  - release
  - docker

default:
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths:
      - .pnpm-store
      - .nx/cache
  before_script:
    - corepack enable && corepack prepare pnpm@10.23.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

setup:
  stage: setup
  script:
    - pnpm nx run @nest-mono/proto:generate
  artifacts:
    paths:
      - packages/libs/proto/src/generated
    expire_in: 1h

lint:
  stage: verify
  needs: [setup]
  script:
    - pnpm nx affected -t lint typecheck

test:
  stage: verify
  needs: [setup]
  script:
    - pnpm nx affected -t test --parallel=2

build:
  stage: build
  needs: [setup]
  script:
    - pnpm nx affected -t build --parallel=2
  artifacts:
    paths:
      - packages/apps/*/dist
    expire_in: 1h

release:
  stage: release
  needs: [lint, test, build]
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        RELEASE_ARGS: "--specifier=prerelease --preid=rc"
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        RELEASE_ARGS: ""
    - when: never
  interruptible: true
  before_script:
    - corepack enable && corepack prepare pnpm@10.23.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - apk add --no-cache git
    - git remote set-url origin "https://oauth2:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git config user.email "ci@example.com"
    - git config user.name "ci"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout "$CI_COMMIT_BRANCH"
    - git reset --hard "origin/$CI_COMMIT_BRANCH"
  script:
    - pnpm nx release $RELEASE_ARGS --yes
    - |
      git tag --points-at HEAD \
        | grep -E '^@nest-mono/(service-a|service-b)@' \
        | sed -E 's|^@nest-mono/([^@]+)@(.+)$|SERVICE=\1 TAG=\2|' \
        > released.env || true
    - cat released.env
  artifacts:
    reports:
      dotenv: released.env
    paths:
      - released.env
    expire_in: 1d

docker:
  stage: docker
  needs:
    - job: release
      artifacts: true
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_BUILDKIT: "1"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"
  interruptible: true
  before_script:
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_REGISTRY"
    - docker buildx create --use --name ci-builder --driver docker-container || docker buildx use ci-builder
  script:
    - |
      if [ ! -s released.env ]; then
        echo "No service tags released — skipping docker stage."
        exit 0
      fi
    - |
      while IFS= read -r line; do
        eval "$line"
        echo "Building $SERVICE:$TAG"
        CACHE_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$SERVICE:buildcache"
        docker buildx build \
          --build-arg "SERVICE=$SERVICE" \
          --tag "$HARBOR_REGISTRY/$HARBOR_PROJECT/$SERVICE:$TAG" \
          --cache-from "type=registry,ref=$CACHE_REF" \
          --cache-to   "type=registry,ref=$CACHE_REF,mode=max" \
          --push \
          .
      done < released.env
